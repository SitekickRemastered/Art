    .button-frame {
      pointer-events: none;
    }

    .button-frame-up,
    .button-frame-over,
    .button-frame-down {
      opacity: 0;
    }

    .button .button-frame-up {
      opacity: 1;
    }

    .button:hover .button-frame-up {
